checkpoints:
  monitor: fmax
  save_best: true
  save_last: true
data:
  go_embeddings_dir: go_gnn_results/balanced_fixed
  processed_dir: processed_data_v4
esm2:
  embeddings_file: ./embeddings/embeddings_t6_8M_mean.npz
  model_name: esm2_t6_8M_UR50D
  use_precomputed: true
inference:
  batch_size: 2048
  threshold: 0.5
logging:
  log_frequency: 100
model:
  dropout: 0.3
  esm_dim: 320
  fusion_type: concat
  go_dim: 256
  hidden_dims:
  - 512
  - 256
  - 128
training:
  batch_size: 512
  learning_rate: 0.001
  num_epochs: 50
  num_workers: 4
  optimizer: adam
  pin_memory: true
  sampling:
    negative_ratio: 3
    sampler_type: uniform
    strategy: negative_sampling
    val_negative_ratio: 1
  scheduler: cosine
  seed: 42
  warmup_epochs: 5
  weight_decay: 0.0001
validation:
  eval_chunk_size: 1000
  use_batch_eval: true
  val_frequency: 1
